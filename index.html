<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Contador de Apariciones de Rostro</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 3/4;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efecto espejo */
    }

    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 16px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }

    .counter {
      font-size: 18px;
      font-weight: 600;
    }

    .status {
      font-size: 14px;
      color: #888;
    }

    .status.active {
      color: #4ade80;
    }

    button {
      margin-top: 16px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:active {
      background: #1d4ed8;
    }
  </style>

  <!-- TensorFlow.js y BlazeFace -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
</head>
<body>

  <div id="container">
    <div id="ui">
      <div>
        <div class="counter">Apariciones: <span id="count">0</span></div>
        <div id="status" class="status">Esperando cámara...</div>
      </div>
      <button id="reset-btn">Reset</button>
    </div>

    <!-- Atributos playsinline, autoplay y muted son obligatorios en iOS Safari -->
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <button id="start-btn">Iniciar Cámara</button>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const countDisplay = document.getElementById('count');
    const statusDisplay = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');

    let model = null;
    let appearances = 0;
    let facePresent = false;
    let consecutiveFramesWithoutFace = 0;
    const FRAME_THRESHOLD_EXIT = 5; // Histeresis para evitar falsos positivos por parpadeo

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });

        video.srcObject = stream;
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        startBtn.style.display = 'none';
        statusDisplay.textContent = 'Cargando modelo...';

        model = await blazeface.load();
        statusDisplay.textContent = 'Listo';
        detectLoop();
      } catch (err) {
        statusDisplay.textContent = 'Error: ' + err.message;
      }
    }

    async function detectLoop() {
      if (!model || video.readyState !== 4) {
        requestAnimationFrame(detectLoop);
        return;
      }

      const predictions = await model.estimateFaces(video, false);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (predictions.length > 0) {
        consecutiveFramesWithoutFace = 0;

        if (!facePresent) {
          facePresent = true;
          appearances++;
          countDisplay.textContent = appearances;
          statusDisplay.textContent = 'Rostro detectado';
          statusDisplay.classList.add('active');
        }

        // Dibujar bounding box
        predictions.forEach(prediction => {
          const start = prediction.topLeft;
          const end = prediction.bottomRight;
          const size = [end[0] - start[0], end[1] - start[1]];

          ctx.strokeStyle = '#4ade80';
          ctx.lineWidth = 3;
          ctx.strokeRect(start[0], start[1], size[0], size[1]);
        });

      } else {
        consecutiveFramesWithoutFace++;
        if (consecutiveFramesWithoutFace >= FRAME_THRESHOLD_EXIT && facePresent) {
          facePresent = false;
          statusDisplay.textContent = 'Sin rostro en marco';
          statusDisplay.classList.remove('active');
        }
      }

      requestAnimationFrame(detectLoop);
    }

    startBtn.addEventListener('click', initCamera);

    resetBtn.addEventListener('click', () => {
      appearances = 0;
      countDisplay.textContent = appearances;
    });
  </script>
</body>
</html>
