<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Entrenador Clúster - Dominadas</title>
  <style>
    body {
      margin: 0; background: #111; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
    }
    #container {
      position: relative; width: 100%; max-width: 480px; aspect-ratio: 3/4;
      background: #000; border-radius: 12px; overflow: hidden; display: none;
    }
    video, canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }
    #ui {
      position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10;
      background: rgba(0, 0, 0, 0.7); padding: 16px; border-radius: 8px; backdrop-filter: blur(8px);
      display: flex; flex-direction: column; gap: 8px;
    }
    .stats { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; }
    .status-text { font-size: 18px; color: #4ade80; text-align: center; margin-top: 8px; font-weight: bold; }
    .timer-text { font-size: 32px; color: #fbbf24; text-align: center; font-variant-numeric: tabular-nums; }
    
    #menu {
      background: #222; padding: 24px; border-radius: 12px; width: 90%; max-width: 320px;
      display: flex; flex-direction: column; gap: 16px;
    }
    #menu h2 { margin: 0 0 8px 0; text-align: center; font-size: 20px; }
    label { display: flex; flex-direction: column; font-size: 14px; color: #aaa; gap: 4px; }
    select, button {
      padding: 12px; font-size: 16px; border-radius: 8px; border: none;
      background: #333; color: #fff; outline: none;
    }
    button { background: #2563eb; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button:active { background: #1d4ed8; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
</head>
<body>

  <div id="menu">
    <h2>Configuración de Clúster</h2>
    <label>Macro-series
      <select id="config-series">
        <option value="2">2 Series</option>
        <option value="3" selected>3 Series</option>
      </select>
    </label>
    <label>Repeticiones por Serie
      <select id="config-reps">
        <option value="1">1 Repetición</option>
        <option value="2" selected>2 Repeticiones</option>
        <option value="3">3 Repeticiones</option>
        <option value="4">4 Repeticiones</option>
        <option value="5">5 Repeticiones</option>
        <option value="6">6 Repeticiones</option>
      </select>
    </label>
    <label>Descanso Corto (entre reps)
      <select id="config-rest">
        <option value="15">15 Segundos</option>
        <option value="20" selected>20 Segundos</option>
      </select>
    </label>
    <button id="start-btn">Empezar Entrenamiento</button>
  </div>

  <div id="container">
    <div id="ui">
      <div class="stats">
        <span id="display-series">Serie: 1/3</span>
        <span id="display-reps">Reps: 0/2</span>
      </div>
      <div id="status" class="status-text">Iniciando cámara...</div>
      <div id="timer" class="timer-text"></div>
    </div>
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    let config = { series: 3, reps: 2, shortRest: 20, longRest: 180 };
    let state = { currentSerie: 1, currentRep: 0, phase: 'INIT' }; 
    
    let model = null;
    let facePresent = false;
    let consecutiveFrames = 0;
    let timerInterval = null;
    let repHoldStartTime = 0; // Variable para controlar el segundo de isometría
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const timerEl = document.getElementById('timer');
    const displaySeries = document.getElementById('display-series');
    const displayReps = document.getElementById('display-reps');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTone(freq, type, duration, vol = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const sounds = {
      rep: () => playTone(880, 'sine', 0.4),
      restStart: () => playTone(440, 'square', 0.4),
      countdown: () => playTone(1000, 'sine', 0.1, 0.05),
      ready: () => {
        playTone(523.25, 'sine', 0.2);
        setTimeout(() => playTone(659.25, 'sine', 0.2), 200);
        setTimeout(() => playTone(783.99, 'sine', 0.4), 400);
      }
    };

    document.getElementById('start-btn').addEventListener('click', async () => {
      config.series = parseInt(document.getElementById('config-series').value);
      config.reps = parseInt(document.getElementById('config-reps').value);
      config.shortRest = parseInt(document.getElementById('config-rest').value);
      
      document.getElementById('menu').style.display = 'none';
      document.getElementById('container').style.display = 'block';
      
      updateDisplay();
      
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      playTone(440, 'sine', 0.1, 0); 
      
      initCamera();
    });

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise(resolve => video.onloadedmetadata = () => { video.play(); resolve(); });
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        statusEl.textContent = 'Cargando IA...';
        model = await blazeface.load();
        
        changePhase('LEAVE_FRAME');
        detectLoop();
      } catch (err) {
        statusEl.textContent = 'Error de cámara';
      }
    }

    function updateDisplay() {
      displaySeries.textContent = `Serie: ${state.currentSerie}/${config.series}`;
      displayReps.textContent = `Reps: ${state.currentRep}/${config.reps}`;
    }

    function changePhase(newPhase) {
      state.phase = newPhase;
      timerEl.textContent = '';
      repHoldStartTime = 0;
      
      switch(newPhase) {
        case 'LEAVE_FRAME':
          statusEl.textContent = 'Sal del marco del teléfono';
          statusEl.style.color = '#f87171';
          break;
        case 'WAITING_REP':
          statusEl.textContent = 'Sube a la barra';
          statusEl.style.color = '#4ade80';
          break;
        case 'POST_REP_DELAY':
          statusEl.textContent = 'Excelente. Bajando...';
          statusEl.style.color = '#60a5fa';
          setTimeout(() => processRestPhase(), 3000);
          break;
        case 'DONE':
          statusEl.textContent = '¡Entrenamiento Completado!';
          statusEl.style.color = '#fbbf24';
          sounds.ready();
          break;
      }
    }

    function processRestPhase() {
      if (state.currentRep >= config.reps) {
        if (state.currentSerie >= config.series) {
          changePhase('DONE');
          return;
        }
        state.currentSerie++;
        state.currentRep = 0;
        updateDisplay();
        startTimer(config.longRest, 'Descanso Largo');
      } else {
        startTimer(config.shortRest, 'Descanso');
      }
    }

    function startTimer(seconds, label) {
      state.phase = 'RESTING';
      statusEl.textContent = label;
      statusEl.style.color = '#fbbf24';
      sounds.restStart();
      
      let timeLeft = seconds;
      timerEl.textContent = formatTime(timeLeft);
      
      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = formatTime(timeLeft);
        
        if (timeLeft <= 5 && timeLeft > 0) {
          sounds.countdown();
        }
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          sounds.ready();
          changePhase('LEAVE_FRAME');
        }
      }, 1000);
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m > 0 ? `${m}:${s.toString().padStart(2, '0')}` : `${s}s`;
    }

    async function detectLoop() {
      if (!model || state.phase === 'DONE') return;

      const predictions = await model.estimateFaces(video, false);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const isFaceDetected = predictions.length > 0;

      if (isFaceDetected) {
        consecutiveFrames = 0;
        if (!facePresent) facePresent = true;

        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 3;
        predictions.forEach(p => {
          ctx.strokeRect(p.topLeft[0], p.topLeft[1], p.bottomRight[0] - p.topLeft[0], p.bottomRight[1] - p.topLeft[1]);
        });

        if (state.phase === 'WAITING_REP') {
          if (repHoldStartTime === 0) {
            repHoldStartTime = Date.now();
            statusEl.textContent = 'Mantén la posición...';
            statusEl.style.color = '#fbbf24';
          } else if (Date.now() - repHoldStartTime >= 1000) {
            state.currentRep++;
            updateDisplay();
            sounds.rep();
            changePhase('POST_REP_DELAY');
          }
        }

      } else {
        consecutiveFrames++;
        if (consecutiveFrames >= 5 && facePresent) {
          facePresent = false;
        }

        if (state.phase === 'WAITING_REP' && repHoldStartTime !== 0) {
          repHoldStartTime = 0;
          statusEl.textContent = 'Sube a la barra';
          statusEl.style.color = '#4ade80';
        }

        if (!facePresent && state.phase === 'LEAVE_FRAME') {
          changePhase('WAITING_REP');
        }
      }

      requestAnimationFrame(detectLoop);
    }
  </script>
</body>
</html>
