<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Entrenador Clúster - Dominadas</title>
  <style>
    body {
      margin: 0; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; width: 100vw; overflow: hidden;
    }
    
    #container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none;
    }
    
    video, canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }
    
    #ui {
      position: absolute; top: 40px; left: 20px; right: 20px; z-index: 10;
      background: rgba(0, 0, 0, 0.4); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); 
      padding: 20px; border-radius: 16px;
      display: flex; flex-direction: column; gap: 12px; 
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }
    
    .stats { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; color: #eee; }
    .status-text { font-size: 20px; color: #4ade80; text-align: center; font-weight: bold; }
    .timer-text { font-size: 40px; color: #fbbf24; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; margin: -10px 0;}
    
    #menu {
      background: rgba(30, 30, 30, 0.6); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1); 
      padding: 32px 24px; border-radius: 20px; 
      width: 85%; max-width: 320px; 
      display: flex; flex-direction: column; gap: 20px; z-index: 20;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    
    #menu h2 { margin: 0 0 8px 0; text-align: center; font-size: 22px; font-weight: 600; }
    label { display: flex; flex-direction: column; font-size: 14px; color: #ddd; gap: 6px; }
    
    select, button {
      padding: 14px; font-size: 16px; border-radius: 12px; border: none;
      background: rgba(255, 255, 255, 0.1); color: #fff; outline: none;
      -webkit-appearance: none; appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    button { 
      background: rgba(37, 99, 235, 0.8); 
      font-weight: 600; cursor: pointer; margin-top: 12px; 
    }
    button:active { background: rgba(29, 78, 216, 0.9); }

    /* Botón de terminar sesión específico */
    #end-session-btn {
      background: rgba(239, 68, 68, 0.5);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px;
      font-size: 14px;
      margin-top: 5px;
    }
    #end-session-btn:active {
      background: rgba(185, 28, 28, 0.7);
    }

    #footer {
      position: absolute; bottom: 20px; width: 100%; text-align: center;
      font-size: 12px; color: rgba(255, 255, 255, 0.4); z-index: 30; pointer-events: none;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
</head>
<body>

  <div id="menu">
    <h2>Configuración de Clúster</h2>
    <label>Macro-series
      <select id="config-series">
        <option value="2">2 Series</option>
        <option value="3" selected>3 Series</option>
      </select>
    </label>
    <label>Repeticiones por Serie
      <select id="config-reps">
        <option value="1">1 Repetición</option>
        <option value="2" selected>2 Repeticiones</option>
        <option value="3">3 Repeticiones</option>
        <option value="4">4 Repeticiones</option>
        <option value="5">5 Repeticiones</option>
        <option value="6">6 Repeticiones</option>
      </select>
    </label>
    <label>Descanso Corto (entre reps)
      <select id="config-rest">
        <option value="15">15 Segundos</option>
        <option value="20" selected>20 Segundos</option>
      </select>
    </label>
    <button id="start-btn">Empezar Entrenamiento</button>
  </div>

  <div id="container">
    <div id="ui">
      <div class="stats">
        <span id="display-series">Serie: 1/3</span>
        <span id="display-reps">Reps: 0/2</span>
      </div>
      <div id="status" class="status-text">Iniciando cámara...</div>
      <div id="timer" class="timer-text"></div>
      <!-- Nuevo botón añadido aquí -->
      <button id="end-session-btn">Terminar Sesión</button>
    </div>
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="footer">v1.0.0</div>

  <script>
    let config = { series: 3, reps: 2, shortRest: 20, longRest: 180 };
    // Estado inicial por defecto
    const initialWorkoutState = { currentSerie: 1, currentRep: 0, phase: 'INIT' };
    let state = { ...initialWorkoutState }; 
    
    let model = null;
    let facePresent = false;
    let consecutiveFrames = 0;
    let timerInterval = null;
    let repHoldStartTime = 0;
    let videoStream = null; // Guardar referencia al stream para apagarlo
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const timerEl = document.getElementById('timer');
    const displaySeries = document.getElementById('display-series');
    const displayReps = document.getElementById('display-reps');
    const endSessionBtn = document.getElementById('end-session-btn');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTone(freq, type, duration, vol = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const sounds = {
      rep: () => playTone(880, 'sine', 0.4),
      restStart: () => playTone(440, 'square', 0.4),
      countdown: () => playTone(1000, 'sine', 0.1, 0.05),
      ready: () => {
        playTone(523.25, 'sine', 0.2);
        setTimeout(() => playTone(659.25, 'sine', 0.2), 200);
        setTimeout(() => playTone(783.99, 'sine', 0.4), 400);
      }
    };

    document.getElementById('start-btn').addEventListener('click', async () => {
      config.series = parseInt(document.getElementById('config-series').value);
      config.reps = parseInt(document.getElementById('config-reps').value);
      config.shortRest = parseInt(document.getElementById('config-rest').value);
      
      document.getElementById('menu').style.display = 'none';
      document.getElementById('container').style.display = 'block';
      
      // Reiniciar estado antes de empezar
      state = { ...initialWorkoutState };
      updateDisplay();
      
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      playTone(440, 'sine', 0.1, 0); 
      
      initCamera();
    });

    // Lógica para terminar sesión
    endSessionBtn.addEventListener('click', () => {
      if (confirm("¿Estás seguro de que quieres terminar la sesión actual?")) {
        terminateSession();
      }
    });

    function terminateSession() {
      // 1. Detener temporizadores activos
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      // 2. Apagar la cámara (liberar recursos)
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
        video.srcObject = null;
      }

      // 3. Reiniciar estado
      state = { ...initialWorkoutState };
      ctx.clearRect(0, 0, canvas.width, canvas.height); // Limpiar canvas

      // 4. Cambiar UI
      document.getElementById('container').style.display = 'none';
      document.getElementById('menu').style.display = 'flex';
    }

    async function initCamera() {
      try {
        statusEl.textContent = 'Iniciando cámara...';
        statusEl.style.color = '#eee';
        
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = videoStream;
        await new Promise(resolve => video.onloadedmetadata = () => { video.play(); resolve(); });
        
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        statusEl.textContent = 'Cargando IA...';
        // Solo cargar el modelo una vez si ya existe
        if (!model) {
          model = await blazeface.load();
        }
        
        changePhase('LEAVE_FRAME');
        detectLoop();
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error de cámara';
        statusEl.style.color = '#f87171';
        // Opción para volver al menú si hay error
        setTimeout(terminateSession, 3000);
      }
    }

    function updateDisplay() {
      displaySeries.textContent = `Serie: ${state.currentSerie}/${config.series}`;
      displayReps.textContent = `Reps: ${state.currentRep}/${config.reps}`;
    }

    function changePhase(newPhase) {
      state.phase = newPhase;
      timerEl.textContent = '';
      repHoldStartTime = 0;
      
      switch(newPhase) {
        case 'LEAVE_FRAME':
          statusEl.textContent = 'Sal del marco del teléfono';
          statusEl.style.color = '#f87171';
          break;
        case 'WAITING_REP':
          statusEl.textContent = 'Sube a la barra';
          statusEl.style.color = '#4ade80';
          break;
        case 'POST_REP_DELAY':
          statusEl.textContent = 'Excelente. Bajando...';
          statusEl.style.color = '#60a5fa';
          // Guardar timeout para poder cancelarlo si se termina la sesión
          state.repTimeout = setTimeout(() => {
            if (state.phase === 'POST_REP_DELAY') processRestPhase();
          }, 3000);
          break;
        case 'DONE':
          statusEl.textContent = '¡Entrenamiento Completado!';
          statusEl.style.color = '#fbbf24';
          sounds.ready();
          // Cambiar texto del botón para "Volver"
          endSessionBtn.textContent = "Volver al Menú";
          endSessionBtn.style.background = "rgba(37, 99, 235, 0.5)"; // Tono azul
          endSessionBtn.style.border = "1px solid rgba(37, 99, 235, 0.3)";
          break;
      }
      // Asegurar que el botón tenga el texto correcto si no es DONE
      if (newPhase !== 'DONE' && endSessionBtn.textContent !== "Terminar Sesión") {
        endSessionBtn.textContent = "Terminar Sesión";
        endSessionBtn.style.background = ""; // Reset a CSS
        endSessionBtn.style.border = "";
      }
    }

    function processRestPhase() {
      if (state.currentRep >= config.reps) {
        if (state.currentSerie >= config.series) {
          changePhase('DONE');
          return;
        }
        state.currentSerie++;
        state.currentRep = 0;
        updateDisplay();
        startTimer(config.longRest, 'Descanso Largo');
      } else {
        startTimer(config.shortRest, 'Descanso');
      }
    }

    function startTimer(seconds, label) {
      state.phase = 'RESTING';
      statusEl.textContent = label;
      statusEl.style.color = '#fbbf24';
      sounds.restStart();
      
      let timeLeft = seconds;
      timerEl.textContent = formatTime(timeLeft);
      
      // Limpiar intervalo previo por seguridad
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = formatTime(timeLeft);
        
        if (timeLeft <= 5 && timeLeft > 0) {
          sounds.countdown();
        }
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          sounds.ready();
          if (state.phase === 'RESTING') changePhase('LEAVE_FRAME');
        }
      }, 1000);
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m > 0 ? `${m}:${s.toString().padStart(2, '0')}` : `${s}s`;
    }

    async function detectLoop() {
      // Detener bucle si el contenedor no está visible (sesión terminada)
      if (!model || state.phase === 'DONE' || document.getElementById('container').style.display === 'none') {
        repHoldStartTime = 0; // Reset por seguridad
        return;
      }

      const predictions = await model.estimateFaces(video, false);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const isFaceDetected = predictions.length > 0;

      if (isFaceDetected) {
        consecutiveFrames = 0;
        if (!facePresent) facePresent = true;

        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 3;
        predictions.forEach(p => {
          ctx.strokeRect(p.topLeft[0], p.topLeft[1], p.bottomRight[0] - p.topLeft[0], p.bottomRight[1] - p.topLeft[1]);
        });

        if (state.phase === 'WAITING_REP') {
          if (repHoldStartTime === 0) {
            repHoldStartTime = Date.now();
            statusEl.textContent = 'Mantén la posición...';
            statusEl.style.color = '#fbbf24';
          } else if (Date.now() - repHoldStartTime >= 1000) {
            state.currentRep++;
            updateDisplay();
            sounds.rep();
            changePhase('POST_REP_DELAY');
          }
        }

      } else {
        consecutiveFrames++;
        if (consecutiveFrames >= 5 && facePresent) {
          facePresent = false;
        }

        if (state.phase === 'WAITING_REP' && repHoldStartTime !== 0) {
          repHoldStartTime = 0;
          statusEl.textContent = 'Sube a la barra';
          statusEl.style.color = '#4ade80';
        }

        if (!facePresent && state.phase === 'LEAVE_FRAME') {
          changePhase('WAITING_REP');
        }
      }

      requestAnimationFrame(detectLoop);
    }
  </script>
</body>
</html>
